# Data pipeline config — see pipelines/run_data_pipeline.py

label_studio:
  url: "${LABEL_STUDIO_URL}"
  api_key: "${LABEL_STUDIO_API_KEY}"
  project_id: 27

# COCO category_id -> class name, as labelled in Label Studio
defect_classes:
  0: cham_do
  1: loi_soi
  2: nep_gap_vai
  3: nep_nhan
  4: bo_qua

# Root holding every dataset version. Each pull creates output/<version>/ with
# info.json, the dataset itself, and later the training experiments run against it.
output_dir: "output"

# Version label for the next pull. Blank -> v<timestamp>, e.g. v20260729_145230.
version: "v1"
