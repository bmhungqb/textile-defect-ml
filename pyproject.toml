[project]
name = "textile-defect-ml"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "rfdetr[train,loggers]",
    "optuna>=3.6,<4.0",
    "label-studio-sdk>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "torch>=2.0",
    "google-cloud-storage>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
# logger.py is a loose module in src/, not a package — packages.find skips it.
py-modules = ["logger"]

[tool.setuptools.packages.find]
where = ["src"]
